
<mat-toolbar color="primary" class="dialog-header">
  {{ data.data.customerName }} - Orders
</mat-toolbar>

<mat-dialog-content class="new-order-container">
  
  <form [formGroup]="orderForm">
    <h3>Order</h3>
    <div class="form-row">

      <mat-form-field appearance="outline">
        <mat-label>Employee*</mat-label>
        <mat-select formControlName="empId">
          <mat-option *ngFor="let emp of employees" [value]="emp.empid">{{ emp.fullName }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Shipper*</mat-label>
        <mat-select formControlName="shipperId">
          <mat-option *ngFor="let ship of shippers" [value]="ship.shipperid">{{ ship.companyname }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ship Name*</mat-label>
      <input matInput formControlName="shipName">
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Ship Address*</mat-label>
        <input matInput formControlName="shipAddress">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ship City*</mat-label>
        <input matInput formControlName="shipCity">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Ship Country*</mat-label>
        <input matInput formControlName="shipCountry">
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Order Date*</mat-label>
        <input matInput [matDatepicker]="orderPicker" formControlName="orderDate">
        <mat-datepicker-toggle matSuffix [for]="orderPicker"></mat-datepicker-toggle>
        <mat-datepicker #orderPicker></mat-datepicker>
      </mat-form-field>
      
      <mat-form-field appearance="outline">
        <mat-label>Required Date*</mat-label>
        <input matInput formControlName="requiredDate" [matDatepicker]="requiredPicker">
        <mat-datepicker-toggle matSuffix [for]="requiredPicker"></mat-datepicker-toggle>
        <mat-datepicker #requiredPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Shipped Date*</mat-label>
        <input matInput formControlName="shippedDate" [matDatepicker]="shippedPicker">
        <mat-datepicker-toggle matSuffix [for]="shippedPicker"></mat-datepicker-toggle>
        <mat-datepicker #shippedPicker></mat-datepicker>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>$ Freight*</mat-label>
      <input matInput formControlName="freight" type="number">
    </mat-form-field>

    <h3>Order Details</h3>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Product*</mat-label>
      <mat-select formControlName="productId">
        <mat-option *ngFor="let prod of products" [value]="prod.productid">{{ prod.productname }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>$ Unit Price*</mat-label>
        <input matInput formControlName="unitPrice" type="number">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quantity*</mat-label>
        <input matInput formControlName="qty" type="number">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Discount*</mat-label>
        <input matInput formControlName="discount" type="number">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button color="primary" (click)="close()">CLOSE</button>
  <button mat-button color="primary" (click)="save()" [disabled]="orderForm.invalid">SAVE</button>
</mat-dialog-actions>
